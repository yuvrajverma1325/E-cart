<h2>Product Details</h2>
<div style="display: flex; justify-content: center; gap: 25px; flex-wrap: wrap;">
    <div style="width: 220px; padding: 20px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.15);">
      <img src="download (26).jpeg" style=" width: 100%; height: 150px; object-fit: contain;">
      <h3>Headphones</h3>
      <p>₹2,499</p>
      <button onclick="addToCart('Headphone', 2499, 'download (26).jpeg')" id="bt">Add to Cart</button>
    </div>
</div>

<script>
function addToCart(name, price) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push({ name, price });
  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Product Added");
}

function viewProduct() {
  window.location.href = "product.html";
}

</script>
