<!DOCTYPE html>
<html>
<head>
  <title>Cart</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="cart.css">
  <style>
    button
    {
    padding:8px;
    width:10%;
    border:none;
    background:darkgray;
    color:black;
    border-radius:10px;
    cursor:pointer;
    }
    button:hover
    {
      background-color: brown;
    }
  </style>
</head>
<body style="  background-color: white; background: url(cart_img.jpeg)no-repeat; background-size:cover;">

<h2 style="color: white;">Your Cart</h2>
<div id="cartItems"></div>
<h3 id="total"></h3>
<button onclick="clearCart()" id="bt">clear</button>
<button onclick="proceedPayment()" id="bt">Proceed to Payment</button>

<script>
  


function addProduct(name, price, image) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push({ name, price, image });
  localStorage.setItem("cart", JSON.stringify(cart));
  alert(name + "Product Added");
}

function loadCart() {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let total = 0;
  cartItems.innerHTML = "";
  cart.forEach(p => {
    cartItems.innerHTML += `<p>${p.name} - ₹${p.price}</p>`;
    total += p.price;
  });
  total.innerText = "Total: ₹" + total;
  localStorage.setItem("total", total);
}

if (document.getElementById("cartItems")) loadCart();

function proceedPayment() {
  window.location.href = "payment.html";
}

if (document.getElementById("payAmount")) {
  payAmount.innerText = "Payable Amount: ₹" + localStorage.getItem("total");
}

function clearCart()
{
  localStorage.removeItem("cart");
  document.getElementById("cartItems").innerHTML="";
  alert("cart cleared successfully");
}
</script>
</body>
</html>
